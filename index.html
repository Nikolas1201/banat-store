<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4a2a16">
<title>Prăvălia din Banat</title>
<style>
/* ===================================================================
   STYLES  (DOM UI layered over a single full-screen canvas)
   =================================================================== */
html,body{margin:0;height:100%;overflow:hidden;background:#4a2a16;overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#5a341e}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#probe{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.screen{position:fixed;inset:0;display:none;pointer-events:none}
.screen.on{display:block}
.pe{pointer-events:auto}
.bar{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
  padding:10px calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left))}
.bar.top{top:0;padding-top:calc(10px + env(safe-area-inset-top))}
.bar.bottom{bottom:0;padding-bottom:calc(16px + env(safe-area-inset-bottom));justify-content:center;gap:20px}
.ibtn{width:46px;height:46px;border-radius:50%;border:none;background:#fff3dc;color:#6b3f24;padding:0;
  box-shadow:0 4px 0 #c79c68,0 6px 10px rgba(0,0,0,.25);display:grid;place-items:center}
.ibtn svg{width:24px;height:24px}
.lvl{background:rgba(60,32,16,.6);color:#fff3dc;padding:7px 16px;border-radius:20px;font-weight:bold;font-size:17px;letter-spacing:.5px;white-space:nowrap}
.lvl em{font-style:normal;color:#ffcf6b;font-size:13px;margin-left:6px}
.coin{display:flex;align-items:center;gap:6px;background:#fff3dc;padding:6px 12px 6px 7px;border-radius:20px;
  font-weight:bold;font-size:16px;box-shadow:0 3px 0 #c79c68;min-width:52px;transition:transform .15s}
.coin.bump{transform:scale(1.18)}
.ci{display:inline-block;width:20px;height:20px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 32%,#fff0b0,#f4b942 50%,#c98a1a);box-shadow:inset 0 0 0 2px #c98a1a}
.tool{position:relative;width:74px;height:64px;border:none;border-radius:18px;background:#fff3dc;color:#6b3f24;
  box-shadow:0 5px 0 #c79c68,0 8px 14px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font-weight:bold;font-size:12px;padding:0}
.tool svg{width:26px;height:26px}
.tool.off{opacity:.45}
.badge{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;border-radius:11px;background:#c8473a;color:#fff;
  font-size:12px;display:grid;place-items:center;padding:0 5px;box-shadow:0 2px 0 #8e2a20;box-sizing:border-box}
.badge.ad{background:#3b6fb6;box-shadow:0 2px 0 #24477a}
.badge svg{width:11px;height:11px}
.ibtn:active,.tool:active,.big:active,.mid:active,.buy:active{transform:translateY(3px)}
.big{border:none;border-radius:22px;background:linear-gradient(#ffd46b,#f0a830);color:#5a2e10;font-weight:bold;font-size:22px;
  padding:16px 30px;box-shadow:0 6px 0 #b8741a,0 10px 18px rgba(0,0,0,.3);min-width:230px}
.mid{border:none;border-radius:18px;background:#fff3dc;color:#6b3f24;font-weight:bold;font-size:17px;padding:12px 20px;
  box-shadow:0 5px 0 #c79c68,0 8px 14px rgba(0,0,0,.22);position:relative}
.mid.blue{background:#5b8fd1;color:#fff;box-shadow:0 5px 0 #2f5d9b,0 8px 14px rgba(0,0,0,.22)}
.mid .dot{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:#c8473a;border:2px solid #fff3dc;display:none}
.mid .dot.on{display:block}
/* title */
.titleBox{position:absolute;left:0;right:0;top:calc(34px + env(safe-area-inset-top));text-align:center}
.logo1{font-family:Georgia,"Times New Roman",serif;font-weight:bold;font-size:clamp(40px,12vw,64px);color:#fff6e6;
  text-shadow:0 3px 0 #8a4d24,0 6px 14px rgba(70,30,10,.45);line-height:1}
.logo2{font-family:Georgia,serif;font-style:italic;font-size:clamp(20px,6vw,30px);color:#7a3a1c;margin-top:4px;text-shadow:0 1px 0 #fff6e6}
.tag{font-size:13px;color:#7a4a2a;margin-top:6px;letter-spacing:2px;text-transform:uppercase}
.titleBtns{position:absolute;left:0;right:0;bottom:calc(36px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:16px}
.row{display:flex;gap:14px}
.titleCoin{position:absolute;right:calc(14px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top))}
/* shop */
.shopTitle{font-family:Georgia,serif;font-weight:bold;font-size:20px;color:#fff6e6;text-shadow:0 2px 0 #6b3f24}
#shopPanel{position:absolute;left:0;right:0;bottom:0;height:46%;background:#fff6e6;border-radius:24px 24px 0 0;
  box-shadow:0 -6px 20px rgba(0,0,0,.25);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.tabs{display:flex;gap:8px;padding:12px 14px 4px}
.tab{flex:1;border:none;border-radius:14px;padding:9px;background:#f0dfc2;color:#8a5a36;font-weight:bold;font-size:14px}
.tab.on{background:#6b3f24;color:#fff3dc}
.progLbl{font-size:12px;color:#9a7a5a;margin:6px 16px 3px;display:flex;justify-content:space-between}
.prog{margin:0 16px 8px;height:10px;background:#ecd9b8;border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#f4b942,#e08a2a);width:0;transition:width .4s}
#shopList{flex:1;overflow-y:auto;touch-action:pan-y;padding:2px 12px 12px;-webkit-overflow-scrolling:touch}
.up{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:8px;box-shadow:0 3px 0 #ead6b4}
.up .num{width:30px;height:30px;border-radius:50%;background:#f0dfc2;display:grid;place-items:center;font-weight:bold;color:#8a5a36;flex:none;font-size:14px}
.up.done .num{background:#5a8a4a;color:#fff}
.up.next{box-shadow:0 3px 0 #f0b850,0 0 0 2px #f4b942 inset}
.up .info{flex:1;min-width:0}
.up b{display:block;font-size:15px}
.up small{color:#9a7a5a;font-size:12px}
.up.locked{opacity:.5}
.up .st{font-size:13px;color:#5a8a4a;font-weight:bold}
.up svg{width:20px;height:20px;color:#a88a6a}
.buy{border:none;border-radius:14px;background:linear-gradient(#ffd46b,#f0a830);padding:8px 12px;font-weight:bold;font-size:15px;
  color:#5a2e10;box-shadow:0 3px 0 #b8741a;display:flex;align-items:center;gap:5px}
.buy .ci{width:16px;height:16px}
.buy.cant{background:#e9dcc6;box-shadow:0 3px 0 #cdb898;color:#a08866}
.heirInfo{padding:8px 16px;font-size:14px;color:#7a5a3a;line-height:1.45}
.heirGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding:0 4px}
.heirGrid div{font-size:13px;background:#fff;border-radius:10px;padding:6px 8px;box-shadow:0 2px 0 #ead6b4}
.heirGrid div.no{color:#c2ab8c;background:#faf1e2}
/* modal */
#modal{position:fixed;inset:0;background:rgba(40,20,8,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:20px;box-sizing:border-box}
#modal.on{display:flex}
.card{background:#fff6e6;border-radius:26px;padding:24px 22px 22px;width:min(340px,100%);text-align:center;box-sizing:border-box;
  box-shadow:0 8px 0 #d9b88a,0 20px 40px rgba(0,0,0,.4);animation:pop .38s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{font-family:Georgia,serif;margin:0 0 6px;font-size:26px;color:#6b3f24}
.card p{margin:6px 0;color:#8a6a4a;font-size:15px}
.card .btns{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:16px}
.card .big{min-width:0;width:100%}
.card .mid{width:100%}
.reward{display:inline-flex;align-items:center;gap:8px;font-size:34px;font-weight:bold;color:#b8741a;margin:10px 0 2px}
.reward .ci{width:32px;height:32px}
.heirBox{margin:12px 0 0;background:#fff;border-radius:18px;padding:10px;box-shadow:0 3px 0 #ead6b4;display:flex;align-items:center;gap:10px;text-align:left}
.heirBox canvas{width:72px;height:72px;flex:none;background:radial-gradient(#fff3c8,#f6deaa);border-radius:14px}
.heirBox b{color:#b8741a;font-size:12px;letter-spacing:1px;text-transform:uppercase;display:block}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:14px 0 4px}
.days div{background:#f0dfc2;border-radius:10px;padding:6px 0;font-size:11px;color:#8a5a36;font-weight:bold}
.days div span{display:block;font-size:13px;color:#5a341e}
.days div.got{background:#5a8a4a;color:#fff}.days div.got span{color:#fff}
.days div.today{background:#f4b942;color:#5a2e10;box-shadow:0 0 0 2px #b8741a inset}
.setRow{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid #f0dfc2;font-weight:bold;font-size:16px}
.tog{width:58px;height:32px;border-radius:16px;border:none;background:#d9c7a8;position:relative;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 3px rgba(0,0,0,.2)}
.tog.on{background:#5a8a4a}.tog.on::after{left:29px}
.danger{background:none;border:none;color:#c8473a;font-weight:bold;font-size:14px;margin-top:14px;padding:8px}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:rgba(50,26,12,.88);
  color:#fff6e6;padding:10px 18px;border-radius:18px;font-size:15px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
  z-index:30;max-width:84%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="cv"></canvas>

<!-- TITLE SCREEN -->
<div id="scrTitle" class="screen">
  <div class="coin titleCoin"><span class="ci"></span><span class="coinVal">0</span></div>
  <div class="titleBox">
    <div class="logo1">Prăvălia</div>
    <div class="logo2">din Banat</div>
    <div class="tag">a cozy sorting puzzle</div>
  </div>
  <div class="titleBtns">
    <button class="big pe" id="btnPlay">Play</button>
    <div class="row">
      <button class="mid pe" id="btnShop">Restore Shop<span class="dot" id="shopDot"></span></button>
      <button class="mid pe" id="btnSet1" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- PLAY SCREEN -->
<div id="scrPlay" class="screen">
  <div class="bar top">
    <button class="ibtn pe" id="btnHome" aria-label="Home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 11.2 12 3.5l9 7.7V21h-6.2v-6H9.2v6H3z"/></svg></button>
    <div class="lvl" id="lvlLabel">Level 1</div>
    <div class="coin"><span class="ci"></span><span class="coinVal">0</span></div>
  </div>
  <div class="bar bottom">
    <button class="tool pe" id="btnUndo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Undo<span class="badge" id="undoBadge">3</span></button>
    <button class="tool pe" id="btnShelf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M5 9h14M5 15h14"/><path d="M12 10.5v3M10.5 12h3" stroke-width="2"/></svg>Shelf<span class="badge" id="shelfBadge">1</span></button>
    <button class="tool pe" id="btnRestart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.7-6.2L3.5 8.4"/><path d="M3.5 3.5v4.9h4.9"/></svg>Restart</button>
  </div>
</div>

<!-- SHOP SCREEN -->
<div id="scrShop" class="screen">
  <div class="bar top">
    <button class="ibtn pe" id="btnBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="shopTitle">Your Shop</div>
    <div class="coin"><span class="ci"></span><span class="coinVal">0</span></div>
  </div>
  <div id="shopPanel" class="pe">
    <div class="tabs"><button class="tab on" id="tabUp">Upgrades</button><button class="tab" id="tabHeir">Heirlooms</button></div>
    <div class="progLbl"><span id="progTxt">Restored 0/15</span><span id="progPct">0%</span></div>
    <div class="prog"><i id="progBar"></i></div>
    <div id="shopList"></div>
  </div>
</div>

<div id="modal"><div class="card" id="card"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ===================================================================
   1. UTILITIES
   =================================================================== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const now = () => performance.now();
const TAU = Math.PI * 2;

/** Deterministic PRNG so a level number always produces the same puzzle. */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rnd) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}
function dayStr(offset = 0) {
  const d = new Date(); d.setDate(d.getDate() + offset);
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
/** Rounded-rect path helper. */
function rr(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function circle(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, TAU); }
function ell(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); }
function fillStroke(c, fill, stroke, lw) {
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw || 3; c.stroke(); }
}

/* ===================================================================
   2. STATIC DATA  (items, upgrades, heirlooms)
   =================================================================== */
const CAP = 4;                    // items per shelf
const ITEM_NAMES = ['Honey', 'Apple', 'Thread', 'Bread', 'Egg', 'Cheese', 'Plum', 'Milk', 'Sunflower', 'Syrup', 'Wool'];
const ITEM_COUNT = ITEM_NAMES.length;

// Shop restoration steps, bought in order. (ax, ay) = sparkle anchor in facade units (400x340).
const UPGRADES = [
  { name: 'Sweep the yard',  desc: 'Clear the junk and weeds',       cost: 30,  ax: 320, ay: 312 },
  { name: 'Patch the roof',  desc: 'Fresh clay tiles',               cost: 50,  ax: 200, ay: 100 },
  { name: 'Fix the sign',    desc: 'Repaint "PRĂVĂLIA"',             cost: 70,  ax: 200, ay: 172 },
  { name: 'Paint the walls', desc: 'Warm Banat ochre',               cost: 90,  ax: 200, ay: 250 },
  { name: 'New windows',     desc: 'Clean glass, green shutters',    cost: 120, ax: 107, ay: 237 },
  { name: 'Green door',      desc: 'A welcoming front door',         cost: 150, ax: 200, ay: 276 },
  { name: 'Flower boxes',    desc: 'Red geraniums on the sills',     cost: 180, ax: 107, ay: 286 },
  { name: 'Street lamp',     desc: 'Warm light for evenings',        cost: 210, ax: 378, ay: 192 },
  { name: 'Wooden bench',    desc: 'A seat for village gossip',      cost: 250, ax: 106, ay: 306 },
  { name: 'Striped awning',  desc: 'Shade over the door',            cost: 290, ax: 200, ay: 208 },
  { name: 'Produce crates',  desc: 'Fresh goods out front',          cost: 330, ax: 298, ay: 308 },
  { name: 'Folk motifs',     desc: 'Painted Banat patterns',         cost: 380, ax: 200, ay: 150 },
  { name: 'Grapevine',       desc: 'A leafy vine with grapes',       cost: 430, ax: 70,  ay: 170 },
  { name: 'Shop cat',        desc: 'Mița claims the windowsill',     cost: 490, ax: 284, ay: 266 },
  { name: 'Stork nest',      desc: 'Good luck on the chimney',       cost: 560, ax: 282, ay: 16  },
];

const HEIRLOOMS = [
  { name: 'Painted plate',     desc: "Grandma's Sunday plate." },
  { name: 'Copper kettle',     desc: 'Still whistles after 80 years.' },
  { name: 'Clay jug',          desc: 'An ulcior from the Banat potters.' },
  { name: 'Embroidered towel', desc: 'A ștergar stitched for a wedding.' },
  { name: 'Carved spoon',      desc: 'Whittled by a shepherd.' },
  { name: 'Brass bell',        desc: 'Rang open the shop each morning.' },
  { name: 'Pocket watch',      desc: 'Stopped at a quarter past four.' },
  { name: 'Lace doily',        desc: 'Crocheted by three generations.' },
  { name: 'Dowry chest',       desc: 'Painted with tulips and stars.' },
  { name: 'Oil lamp',          desc: 'Lit the counter before electricity.' },
  { name: 'Silver coin',       desc: 'An old crown found under the floor.' },
  { name: 'Painted egg',       desc: 'Red Easter egg with white lines.' },
];

const DAILY = [30, 40, 50, 60, 80, 100, 150];

/* ===================================================================
   3. PERSISTENT STATE  (localStorage, every access guarded)
   =================================================================== */
const SAVE_KEY = 'banatStore.v1';
const save = { level: 1, coins: 0, upg: 0, heir: [], sound: true, haptics: true,
               lastDaily: '', streak: 0, sinceAd: 0, tutorial: true };
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) { const s = JSON.parse(raw); if (s && typeof s === 'object') Object.assign(save, s); }
  } catch (e) { /* storage unavailable: play with defaults */ }
  if (!Array.isArray(save.heir)) save.heir = [];
  save.level = Math.max(1, save.level | 0);
  save.coins = Math.max(0, save.coins | 0);
  save.upg = clamp(save.upg | 0, 0, UPGRADES.length);
}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ===================================================================
   4. AD HOOKS  (stubs - wire to your Android bridge / ad SDK later)
   =================================================================== */
/** Rewarded ad. Call cb(true) when the reward is earned, cb(false) if skipped. */
function showRewardedAd(cb) {
  // e.g. window.AndroidAds && AndroidAds.showRewarded(); then call cb from the bridge.
  setTimeout(() => cb && cb(true), 0);   // stub: grant immediately
}
/** Interstitial ad between levels. */
function showInterstitial() { /* stub: no-op */ }

/* ===================================================================
   5. AUDIO  (all sounds synthesized with Web Audio)
   =================================================================== */
const Sfx = {
  ctx: null, master: null, noiseBuf: null,
  /** Create/resume the context. Must run inside a real user-activation event
   *  (touchend / pointerup / click) - mobile browsers ignore touch pointerdown. */
  init() {
    if (this.ctx) { this.wake(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.7;
      this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 0.3, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;
      this.wake();
    } catch (e) { this.ctx = null; }
  },
  /** Resume from 'suspended' or iOS 'interrupted' (silent switch, calls, app switch)
   *  and play a 1-sample silent buffer, which fully unlocks output on iOS. */
  wake() {
    const c = this.ctx; if (!c || c.state === 'closed') return;
    if (c.state !== 'running') { try { c.resume(); } catch (e) {} }
    try { const s = c.createBufferSource(); s.buffer = c.createBuffer(1, 1, 22050); s.connect(c.destination); s.start(0); } catch (e) {}
  },
  ok() {

    [1318, 1568, 2093].forEach((f, i) => this.tone(f, 0.9, { vol: 0.07, delay: 0.68 + i * 0.04 }));
  },
  coin()  { this.tone(1318, 0.08, { type: 'square', vol: 0.045 }); this.tone(1976, 0.2, { type: 'square', vol: 0.045, delay: 0.07 }); },

/* Haptics: Android uses navigator.vibrate. iPhone Safari has no vibrate API, but

const hasVibrate = typeof navigator.vibrate === 'function';
let iosSwitch = null, lastTick = 0;

  if (!iosSwitch) {
    const lab = document.createElement('label'), inp = document.createElement('input');
    inp.type = 'checkbox'; inp.setAttribute('switch', '');
    lab.style.cssText = 'position:fixed;left:-100px;top:0;opacity:0;pointer-events:none';
    lab.appendChild(inp); document.body.appendChild(lab); iosSwitch = lab;

/* ===================================================================
   6. LEVEL GENERATOR  (seeded random deal + solver = always solvable)
   =================================================================== */
/** Difficulty curve: more types (=> more shelves) and occasionally only one empty shelf. */
function levelSpec(L) {
  const types = Math.min(10, 3 + Math.floor(L / 3));
  let empty = 2;
  if ((L >= 10 && L % 4 === 0) || (L >= 25 && L % 3 === 0)) empty = 1;
  return { types, empty };
}

/** Depth-first solver over shelf strings. Returns true if the deal can be fully sorted. */
function solvable(shelves, limit = 25000) {
  const start = shelves.map(s => s.map(v => String.fromCharCode(97 + v)).join(''));
  const seen = new Set(); let nodes = 0;
  const uniform = s => { for (let i = 1; i < s.length; i++) if (s[i] !== s[0]) return false; return true; };
  const solved = st => st.every(s => !s.length || (s.length === CAP && uniform(s)));
  function dfs(st) {
    if (solved(st)) return true;
    if (++nodes > limit) return false;
    const key = st.slice().sort().join('|');
    if (seen.has(key)) return false;
    seen.add(key);
    const moves = [];
    for (let a = 0; a < st.length; a++) {
      const A = st[a]; if (!A.length) continue;
      if (A.length === CAP && uniform(A)) continue;            // locked complete shelf
      const t = A[A.length - 1]; let run = 0;
      for (let i = A.length - 1; i >= 0 && A[i] === t; i--) run++;
      let triedEmpty = false;
      for (let b = 0; b < st.length; b++) {
        if (a === b) continue; const B = st[b];
        if (B.length >= CAP) continue;
        if (!B.length) {
          if (run === A.length || triedEmpty) continue;          // pointless / symmetric
          triedEmpty = true; moves.push([a, b, run, 1]);
        } else if (B[B.length - 1] === t) moves.push([a, b, run, 0]);
      }
    }
    moves.sort((m, n) => m[3] - n[3]);                          // prefer stacking on matches
    for (const [a, b, run] of moves) {
      const n = Math.min(run, CAP - st[b].length);
      const nx = st.slice();
      nx[a] = st[a].slice(0, st[a].length - n);
      nx[b] = st[b] + st[a].slice(st[a].length - n);
      if (dfs(nx)) return true;
    }
    return false;
  }
  return dfs(start);
}

/** Build level L: pick item kinds, deal them randomly, keep the first solvable deal. */
function generateLevel(L) {
  const sp = levelSpec(L);
  let empty = sp.empty;
  for (let pass = 0; pass < 4; pass++) {
    for (let a = 0; a < 24; a++) {
      const rnd = mulberry32(L * 7919 + a * 104729 + pass * 337 + 11);
      const kinds = shuffle([...Array(ITEM_COUNT).keys()], rnd).slice(0, sp.types);
      const pool = [];
      kinds.forEach(k => { for (let i = 0; i < CAP; i++) pool.push(k); });
      shuffle(pool, rnd);
      const sh = [];
      for (let i = 0; i < sp.types; i++) sh.push(pool.slice(i * CAP, i * CAP + CAP));
      if (sh.some(s => s.every(v => v === s[0]))) continue;     // no shelf pre-solved
      for (let i = 0; i < empty; i++) sh.push([]);
      if (solvable(sh)) return { shelves: sh, hard: empty < 2 };
    }
    empty++;                                                    // relax and retry
  }
  // Fallback (practically unreachable): trivially solvable layout.
  const sh = []; for (let i = 0; i < sp.types; i++) sh.push([i, i, i, i]);
  return { shelves: sh.concat([[], []]), hard: false };
}

/* ===================================================================
   7. RUNTIME GAME STATE + RULES
   =================================================================== */
let G = null;          // current level session
let itemUid = 0;
let screen = 'title';

function startLevel() {
  const lv = generateLevel(save.level);
  G = {
    level: save.level, hard: lv.hard,
    shelves: lv.shelves.map(s => s.map(t => ({ t, id: itemUid++, x: 0, y: 0, fly: null, land: -1e9 }))),
    sel: -1, hist: [], undos: 3, extraUsed: 0, usedUndo: false, won: false,
    done: [], doneAt: [], shake: [], stuckShown: false, startAt: now(),
  };
  G.done = G.shelves.map(() => false);
  G.doneAt = G.shelves.map(() => -1e9);
  G.shake = G.shelves.map(() => -1e9);
  layoutPlay(); snapItems(); updateHud();
  $('lvlLabel').innerHTML = 'Level ' + G.level + (G.hard ? '<em>TRICKY</em>' : '');
  if (save.tutorial && G.level === 1) setTimeout(() => toast('Tap a shelf to lift goods, then tap where they go'), 500);
}

const topRun = sh => { if (!sh.length) return 0; const t = sh[sh.length - 1].t; let n = 0; for (let i = sh.length - 1; i >= 0 && sh[i].t === t; i--) n++; return n; };
const isComplete = sh => sh.length === CAP && topRun(sh) === CAP;
const isSolved = () => G.shelves.every(s => !s.length || isComplete(s));
const anyFlying = () => G.shelves.some(s => s.some(it => it.fly));
function canMove(a, b) {
  const A = G.shelves[a], B = G.shelves[b];
  if (a === b || !A.length || B.length >= CAP || isComplete(A)) return false;
  return !B.length || B[B.length - 1].t === A[A.length - 1].t;
}
/** True if at least one meaningful move exists. */
function hasUsefulMove() {
  for (let a = 0; a < G.shelves.length; a++) for (let b = 0; b < G.shelves.length; b++) {
    if (!canMove(a, b)) continue;
    if (!G.shelves[b].length && topRun(G.shelves[a]) === G.shelves[a].length) continue;
    return true;
  }
  return false;
}

/** Player tapped shelf i. */
function tapShelf(i) {
  if (!G || G.won) return;
  const S = G.shelves;
  if (G.sel < 0) {
    if (!S[i].length) return;
    if (isComplete(S[i])) { G.shake[i] = now(); Sfx.click(); return; }
    G.sel = i; Sfx.pop(); buzz(8);
    if (save.tutorial) { save.tutorial = false; persist(); }
    return;
  }
  if (G.sel === i) { G.sel = -1; Sfx.click(); return; }
  if (canMove(G.sel, i)) { const a = G.sel; G.sel = -1; doMove(a, i, true); return; }
  // Invalid drop: switch selection to another usable shelf, otherwise shake.
  if (S[i].length && !isComplete(S[i])) { G.sel = i; Sfx.pop(); buzz(8); return; }
  G.shake[i] = now(); Sfx.err(); buzz([12, 40, 12]); G.sel = -1;
}

/** Move the top run (or exactly `count` items) from shelf a to shelf b with arc tweens. */
function doMove(a, b, record, count) {
  const A = G.shelves[a], B = G.shelves[b];
  const n = count != null ? count : Math.min(topRun(A), CAP - B.length);
  if (n <= 0) return;
  const moving = A.splice(A.length - n, n);
  const t0 = now();
  moving.forEach((it, k) => {
    const dest = slotPos(b, B.length);
    const dist = Math.hypot(dest.x - it.x, dest.y - it.y);
    it.fly = { sx: it.x, sy: it.y, t0, delay: k * 65, dur: clamp(300 + dist * 0.45, 340, 620), b, k, last: k === n - 1 };
    B.push(it);
  });
  if (record) G.hist.push({ a, b, n });
  if (G.done[a] && !isComplete(A)) G.done[a] = false;
  if (G.done[b] && !isComplete(B)) G.done[b] = false;
  G.stuckShown = false;
  Sfx.tone(520, 0.07, { to: 760, vol: 0.08 });
}

/** Called when the last item of a move lands. */
function onMoveLanded(b) {
  const B = G.shelves[b];
  if (isComplete(B) && !G.done[b]) {
    G.done[b] = true; G.doneAt[b] = now();
    const c = shelfCenter(b);
    burst(c.x, c.y, 26, ['#fff6c8', '#ffd46b', '#ffffff', '#f4b942'], 'spark');
    Sfx.chime(); buzz(25);
  }
  if (anyFlying()) return;
  if (isSolved()) winLevel();
  else if (!hasUsefulMove() && !G.stuckShown) { G.stuckShown = true; toast('No moves left - try Undo or an extra shelf'); }
}

function undo() {
  if (!G || G.won) return;
  if (!G.hist.length) { toast('Nothing to undo'); Sfx.click(); return; }
  if (G.undos <= 0) {
    showRewardedAd(ok => { if (ok) { G.undos += 2; updateHud(); toast('+2 undos'); Sfx.coin(); } });
    return;
  }
  const m = G.hist.pop();
  G.undos--; G.usedUndo = true; G.sel = -1;
  doMove(m.b, m.a, false, m.n);
  Sfx.click(); buzz(6); updateHud();
}

function addShelf() {
  if (!G || G.won) return;
  const grant = () => {
    G.shelves.push([]); G.done.push(false); G.doneAt.push(-1e9); G.shake.push(-1e9);
    G.extraUsed++; G.stuckShown = false;
    layoutPlay(); updateHud();
    const c = shelfCenter(G.shelves.length - 1);
    burst(c.x, c.y, 18, ['#fff6c8', '#ffd46b', '#ffffff'], 'spark');
    Sfx.chime(); buzz(15);
  };
  if (G.extraUsed === 0) grant();
  else if (G.extraUsed === 1) showRewardedAd(ok => { if (ok) grant(); });
  else { toast('No more shelves fit in the store!'); Sfx.err(); }
}

function restartLevel() { if (!G) return; Sfx.click(); startLevel(); }

/* ---------- Level win & rewards ---------- */
function winLevel() {
  if (G.won) return;
  G.won = true; G.sel = -1;
  const L = G.level;
  const base = 15 + L * 3, bonus = G.usedUndo ? 0 : 10, hardBonus = G.hard ? 15 : 0;
  const total = base + bonus + hardBonus;
  // heirloom: guaranteed every 6th level, else 10% chance
  let heir = -1;
  const missing = HEIRLOOMS.map((_, i) => i).filter(i => !save.heir.includes(i));
  if (missing.length && (L % 6 === 0 || Math.random() < 0.10)) {
    heir = missing[Math.floor(Math.random() * missing.length)];
    save.heir.push(heir);
  }
  save.coins += total; save.level = L + 1; persist();
  G.reward = { total, bonus, hardBonus, heir };
  confetti(80);
  Sfx.jingle(); buzz([30, 50, 30, 50, 80]);
  setTimeout(() => showComplete(), 1150);
}

/* ===================================================================
   8. LAYOUT  (screen metrics, safe areas, shelf grid)
   =================================================================== */
const cv = $('cv'), ctx = cv.getContext('2d', { alpha: false });   // every screen paints a full background
// Render caches (rebuilt on resize / layout change).
const spriteCache = new Map();   // item type+size -> pre-drawn canvas
const shelfCache = new Map();    // shelf variant+size -> pre-drawn canvas
const sceneCache = { key: '', sky: null, front: null };   // title/shop static layers
let W = 0, H = 0, dpr = 1;
const safe = { t: 0, r: 0, b: 0, l: 0 };
let Lay = null;        // shelf layout
let bgPlay = null;     // cached interior background

function measure() {
  // Cap at 2x: phones like the Galaxy A54 report ~2.6, and the extra pixels cost a lot of fill-rate.
  dpr = Math.min(2, window.devicePixelRatio || 1);
  spriteCache.clear(); shelfCache.clear(); sceneCache.key = '';
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const cs = getComputedStyle($('probe'));
  safe.t = parseFloat(cs.paddingTop) || 0; safe.r = parseFloat(cs.paddingRight) || 0;
  safe.b = parseFloat(cs.paddingBottom) || 0; safe.l = parseFloat(cs.paddingLeft) || 0;
  bgPlay = buildPlayBG();
  if (G) { layoutPlay(); snapItems(); }
}

const RATIO_SLOT = 0.74, RATIO_BASE = 0.16, RATIO_CAP = 0.14;
function layoutPlay() {
  const n = G.shelves.length;
  const top = safe.t + 76, bot = H - safe.b - 104;
  const availW = W - safe.l - safe.r - 20, availH = Math.max(200, bot - top);
  const ratio = 4 * RATIO_SLOT + RATIO_BASE + RATIO_CAP;     // shelf height / width
  const head = 1.0;                                            // lift headroom (in shelf widths)
  let best = null;
  for (let r = 1; r <= 3; r++) {
    const cols = Math.ceil(n / r);
    const w = Math.min((availW / cols) * 0.8, availH / r / (ratio + head + 0.12), 96);
    if (!best || w > best.w + 0.5) best = { r, cols, w };
  }
  const { r, cols, w } = best;
  const h = w * ratio, rowH = h + w * (head + 0.12);
  const cellW = Math.min(availW / cols, w * 1.45);
  const y0 = top + (availH - rowH * r) / 2 + w * head;
  const pos = [];
  for (let row = 0; row < r; row++) {
    const inRow = row < r - 1 ? cols : n - cols * (r - 1);
    const x0 = safe.l + 10 + (availW - inRow * cellW) / 2;
    for (let k = 0; k < inRow; k++) pos.push({ x: x0 + k * cellW + (cellW - w) / 2, y: y0 + row * rowH });
  }
  Lay = { w, h, cellW, slotH: w * RATIO_SLOT, base: w * RATIO_BASE, cap: w * RATIO_CAP, pos, item: w * 0.8 };
  shelfCache.clear();
}
/** Centre of slot idx (0 = bottom) on shelf si. */
function slotPos(si, idx) {
  const p = Lay.pos[si];
  return { x: p.x + Lay.w / 2, y: p.y + Lay.h - Lay.base - Lay.slotH * (idx + 0.5) + Lay.slotH * 0.06 };
}
function shelfCenter(si) { const p = Lay.pos[si]; return { x: p.x + Lay.w / 2, y: p.y + Lay.h / 2 }; }
function snapItems() {
  G.shelves.forEach((s, si) => s.forEach((it, i) => { const p = slotPos(si, i); it.x = p.x; it.y = p.y; it.fly = null; }));
}
function shelfAt(x, y) {
  if (!Lay) return -1;
  let best = -1, bd = 1e9;
  Lay.pos.forEach((p, i) => {
    const pad = (Lay.cellW - Lay.w) / 2 + 4;
    if (x >= p.x - pad && x <= p.x + Lay.w + pad && y >= p.y - Lay.w * 1.0 && y <= p.y + Lay.h + 14) {
      const d = Math.abs(x - (p.x + Lay.w / 2)); if (d < bd) { bd = d; best = i; }
    }
  });
  return best;
}
/** Facade placement for title / shop screens. Returns {x, y, sc, ground}. */
function facadeRect() {
  if (screen === 'shop') {
    const top = safe.t + 64, panelTop = H * 0.54;
    const sc = Math.min(W / 400, (panelTop - top) / 330);
    const ground = panelTop - 6 * sc;
    return { sc, x: (W - 400 * sc) / 2, y: ground - 322 * sc, ground };
  }
  const ground = H * 0.72;
  const sc = Math.min(W * 0.98 / 400, H * 0.45 / 330);
  return { sc, x: (W - 400 * sc) / 2, y: ground - 322 * sc, ground };
}

function drawShelf(c, si, t) {

/** Update tween positions for every item (springs to slot, or flies an arc). */
function updateItems(dt, t) {
  const k = 1 - Math.exp(-dt * 22);
  G.shelves.forEach((S, si) => {
    const run = si === G.sel ? topRun(S) : 0;
    S.forEach((it, idx) => {
      const sp = slotPos(si, idx);
      let tx = sp.x, ty = sp.y;
      if (run && idx >= S.length - run) ty -= Lay.slotH * 0.95 + Math.sin(t / 220) * Lay.w * 0.03;
      if (it.fly) {
        const f = it.fly, p = clamp((t - f.t0 - f.delay) / f.dur, 0, 1);
        if (p > 0) {
          const e = easeInOut(p);
          const cy = Math.min(f.sy, ty) - (Lay.w * 0.6 + Math.abs(tx - f.sx) * 0.22);
          it.x = lerp(f.sx, tx, e);
          it.y = (1 - e) * (1 - e) * f.sy + 2 * (1 - e) * e * cy + e * e * ty;
        }
        if (p >= 1) {
          it.fly = null; it.land = t; it.x = tx; it.y = ty;
          Sfx.drop(f.k); buzz(5);
          if (f.last) onMoveLanded(f.b);
        }
      } else {
        it.x += (tx - it.x) * k; it.y += (ty - it.y) * k;
      }
    });
  });
}

function renderPlay(c, t) {
  if (bgPlay) c.drawImage(bgPlay, 0, 0, W, H);
  if (!G) return;
  for (let i = 0; i < G.shelves.length; i++) drawShelf(c, i, t);
  const s = Lay.item, flying = [];
  G.shelves.forEach((S, si) => S.forEach((it, idx) => {
    if (it.fly) { flying.push(it); return; }
    const age = (t - it.land) / 1000;
    const sq = age < 0.45 ? Math.exp(-age * 9) * Math.cos(age * 28) * 0.22 : 0;
    const lifted = si === G.sel && idx >= S.length - topRun(S);
    drawItem(c, it.t, it.x, it.y, s * (lifted ? 1.06 : 1), sq, !lifted);
  }));
  flying.forEach(it => drawItem(c, it.t, it.x, it.y, s * 1.08, 0, false));
}

const parts = [];

      col: cols[i % cols.length], size: 3 + Math.random() * 5, rot: Math.random() * TAU, vr: (Math.random() - .5) * 10 });

}

    parts.push({ x: fromLeft ? -10 : W + 10, y: H * (0.35 + Math.random() * 0.3),
      vx: (fromLeft ? 1 : -1) * (180 + Math.random() * 360), vy: -(300 + Math.random() * 420), life: 0, max: 2.2 + Math.random(),

function updateParts(dt) {

    // drop dead particles and confetti that has fallen off-screen

  if (shopTab === 'heir') {
    list.innerHTML = `<div class="heirInfo">Family treasures turn up as rare rewards for clearing levels. Tap one in the cabinet to read its story.</div>
      <div class="heirGrid">${HEIRLOOMS.map((h, i) => `<div class="${save.heir.includes(i) ? '' : 'no'}">${save.heir.includes(i) ? h.name : '???'}</div>`).join('')}</div>`;
    return;
  }
  list.innerHTML = UPGRADES.map((u, i) => {
    const cls = i < done ? 'done' : i === done ? 'next' : 'locked';
    let right;
    if (i < done) right = '<span class="st">Done</span>';
    else if (i === done) right = `<button class="buy ${save.coins >= u.cost ? '' : 'cant'}" data-i="${i}"><span class="ci"></span>${u.cost}</button>`;
    else right = LOCK_ICON;
    return `<div class="up ${cls}"><div class="num">${i < done ? '&#10003;' : i + 1}</div><div class="info"><b>${u.name}</b><small>${u.desc}</small></div>${right}</div>`;
  }).join('') + (done >= total ? '<div class="heirInfo" style="text-align:center"><b>The shop is fully restored!</b><br>Keep sorting to find every heirloom.</div>' : '');
  const btn = list.querySelector('.buy');
  if (btn) btn.onclick = () => buyUpgrade(+btn.dataset.i);
  const nx = list.querySelector('.up.next');
  if (nx) nx.scrollIntoView({ block: 'nearest' });
}
function buyUpgrade(i) {
  const u = UPGRADES[i];
  if (i !== save.upg) return;
  if (save.coins < u.cost) { Sfx.err(); buzz([10, 40, 10]); toast(`Need ${u.cost - save.coins} more coins - solve a few levels!`); return; }
  save.coins -= u.cost; save.upg++; persist();
  const f = facadeRect();
  const x = f.x + u.ax * f.sc, y = f.y + u.ay * f.sc;
  burst(x, y, 36, ['#fff6c8', '#ffd46b', '#ffffff', '#f4b942', '#c8473a'], 'spark');
  Sfx.buy(); buzz([15, 30, 25]);
  updateCoins(true); buildShop();
  if (save.upg === UPGRADES.length) setTimeout(() => { confetti(90); Sfx.jingle(); toast('Prăvălia is fully restored! Bravo!', 3000); }, 500);
  else toast(u.name + ' - done!');
}

/* ---------- Settings ---------- */
function showSettings() {
  let resetArm = false;
  openModal(`<h2>Settings</h2>
    <div class="setRow">Sound <button class="tog ${save.sound ? 'on' : ''}" id="tSound" aria-label="Sound"></button></div>
    <div class="setRow">Vibration <button class="tog ${save.haptics ? 'on' : ''}" id="tHap" aria-label="Vibration"></button></div>
    <div class="btns"><button class="big" id="sClose">Done</button></div>
    <button class="danger" id="sReset">Reset all progress</button>
    <p style="font-size:11px;color:#b8a080;margin-top:4px">Prăvălia din Banat · v1.0</p>`);
  $('tSound').onclick = () => { save.sound = !save.sound; persist(); $('tSound').classList.toggle('on', save.sound); Sfx.click(); };
  $('tHap').onclick = () => { save.haptics = !save.haptics; persist(); $('tHap').classList.toggle('on', save.haptics); buzz(20); };
  $('sClose').onclick = () => { Sfx.click(); closeModal(); };
  $('sReset').onclick = () => {
    if (!resetArm) { resetArm = true; $('sReset').textContent = 'Tap again to erase everything'; return; }
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    Object.assign(save, { level: 1, coins: 0, upg: 0, heir: [], lastDaily: '', streak: 0, sinceAd: 0, tutorial: true });
    persist(); G = null; closeModal(); show('title'); toast('Progress reset');
  };
}

/* ---------- Daily reward ---------- */
function checkDaily() {
  const today = dayStr();
  if (save.lastDaily === today) return;
  const streak = save.lastDaily === dayStr(-1) ? Math.min(7, save.streak + 1) : 1;
  const amt = DAILY[(streak - 1) % 7];
  const days = DAILY.map((v, i) => `<div class="${i < streak - 1 ? 'got' : i === streak - 1 ? 'today' : ''}">Day ${i + 1}<span>${v}</span></div>`).join('');
  openModal(`<h2>Daily gift</h2><p>Bună dimineața! Thanks for opening the shop today.</p>
    <div class="days">${days}</div>
    <div class="reward"><span class="ci"></span>+${amt}</div>
    <div class="btns"><button class="big" id="dClaim">Claim</button></div>`);
  $('dClaim').onclick = () => {
    save.coins += amt; save.lastDaily = today; save.streak = streak; persist();
    Sfx.buy(); buzz([15, 30, 15]); closeModal(); updateCoins(true); refreshTitle();
    burst(W / 2, H * 0.45, 30, ['#fff6c8', '#ffd46b', '#f4b942'], 'spark');
  };
}

/* ---------- Button wiring ---------- */
$('btnPlay').onclick = () => { Sfx.click(); if (!G || G.won || G.level !== save.level) startLevel(); show('play'); layoutPlay(); };
$('btnShop').onclick = () => { Sfx.click(); show('shop'); };
$('btnSet1').onclick = () => { Sfx.click(); showSettings(); };
$('btnHome').onclick = () => { Sfx.click(); if (G) G.sel = -1; show('title'); };
$('btnBack').onclick = () => { Sfx.click(); show('title'); };
$('btnUndo').onclick = undo;
$('btnShelf').onclick = addShelf;
$('btnRestart').onclick = restartLevel;
$('tabUp').onclick = () => { shopTab = 'up'; Sfx.click(); buildShop(); };
$('tabHeir').onclick = () => { shopTab = 'heir'; Sfx.click(); buildShop(); };

/* ===================================================================
   12. MAIN LOOP + BOOT
   =================================================================== */
let lastT = now();
function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  if (screen === 'play' && G) updateItems(dt, t);
  updateParts(dt);
  render(t);
  requestAnimationFrame(frame);
}
window.addEventListener('resize', measure);
window.addEventListener('orientationchange', () => setTimeout(measure, 200));
document.addEventListener('visibilitychange', () => {
  if (document.hidden && Sfx.ctx) Sfx.ctx.suspend(); else Sfx.wake();
  lastT = now();
});

loadSave();
measure();
show('title');
setTimeout(checkDaily, 400);
requestAnimationFrame(frame);

// Debug/test handle (harmless in production).
window.__game = { save, get G() { return G; }, tapShelf, startLevel, generateLevel, solvable, show, winLevel };
</script>
</body>
